    <style type="text/css">
        html,
        body {
            height: 100%;
            width: 100%;
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .fill-viewport {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }

        .fill-viewport.landscape-left {
            left: env(safe-area-inset-left);
        }

        .fill-viewport.landscape-right {
            right: env(safe-area-inset-right);
        }

        #viewer {
            z-index: 1;
        }

        /* Code mau: menu dieu huong panorama nam ben trai man hinh. */
        .panorama-menu {
            position: fixed;
            top: 50%;
            left: 18px;
            left: calc(18px + env(safe-area-inset-left));
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transform: translateY(-50%);
        }

        .panorama-menu__button {
            min-width: 112px;
            min-height: 42px;
            padding: 0 14px;
            border: 0;
            border-radius: 6px;
            background: rgba(20, 24, 31, 0.84);
            color: #fff;
            font: 700 14px/1 Arial, sans-serif;
            letter-spacing: 0;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
            cursor: pointer;
            touch-action: manipulation;
        }

        .panorama-menu__button:hover,
        .panorama-menu__button:focus-visible {
            background: rgba(1, 178, 230, 0.94);
            outline: none;
        }

        .panorama-menu__button:active {
            transform: translateY(1px);
        }

        #openNextPanoButton {
            position: fixed;
            left: 18px;
            left: calc(18px + env(safe-area-inset-left));
            bottom: 18px;
            bottom: calc(18px + env(safe-area-inset-bottom));
            z-index: 9999;
            min-width: 144px;
            min-height: 46px;
            padding: 0 16px;
            border: 0;
            border-radius: 6px;
            background: rgba(1, 178, 230, 0.92);
            color: #fff;
            font: 700 15px/1 Arial, sans-serif;
            letter-spacing: 0;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
            cursor: pointer;
            touch-action: manipulation;
        }

        #openNextPanoButton:hover,
        #openNextPanoButton:focus-visible {
            background: rgba(41, 87, 164, 0.96);
            outline: none;
        }

        #openNextPanoButton:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>
    <div id="viewer" class="fill-viewport"></div>

    <!--
        Code mau cho lap trinh vien:
        - Moi button khai bao panorama can mo trong data-pano-name.
        - JS ben duoi se doc data-pano-name va goi openPanoramaByName(name) trong js/panorama.js.
        - Muon them panorama moi: copy them button va doi gia tri data-pano-name.
    -->
    <nav class="panorama-menu" aria-label="Panorama menu">
        <button class="panorama-menu__button" type="button" data-pano-name="pano-01">Pano 01</button>
        <button class="panorama-menu__button" type="button" data-pano-name="pano-02">Pano 02</button>
        <button class="panorama-menu__button" type="button" data-pano-name="pano-03">Pano 03</button>
    </nav>

    <button id="openNextPanoButton" type="button">Open next pano</button>

    <script>
        /*
            Code mau: bat su kien click cho toan bo menu.
            Ham openPanoramaByName(name) da duoc dinh nghia trong ../js/panorama.js.
        */
        document.querySelector('.panorama-menu').addEventListener('click', function(event) {
            var button = event.target.closest('[data-pano-name]');
            if (!button) {
                return;
            }

            event.preventDefault();
            event.stopPropagation();

            var panoramaName = button.getAttribute('data-pano-name');
            openPanoramaByName(panoramaName);
        });
    </script>
</body>
